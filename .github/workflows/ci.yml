name: CI Build & Sanity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  opensuse-build:
    name: openSUSE Tumbleweed Build & Test (Drivers & Tools)
    runs-on: ubuntu-latest
    container:
      image: registry.opensuse.org/opensuse/tumbleweed:latest
    steps:
      - name: Install dependencies
        run: |
          for i in 1 2 3; do zypper --non-interactive --gpg-auto-import-keys refresh && break || sleep 5; done
          zypper --non-interactive install -y \
            kernel-default-devel \
            kernel-devel \
            gcc-c++ \
            make \
            meson \
            ninja \
            libcamera-devel \
            python3 \
            bash \
            findutils \
            coreutils \
            kmod \
            tar \
            gzip \
            gawk \
            bc \
            bison \
            flex \
            libelf-devel

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build tools/ir-grab
        run: |
          make ir-grab
          ./tools/ir-grab/build/ir-grab --help

      - name: Build kernel modules
        run: |
          # In openSUSE, kernel-default-devel creates /usr/src/linux-*-obj/x86_64/default
          KDIR="$(ls -d /usr/src/linux*-obj/x86_64/default 2>/dev/null | head -n 1)"
          if [ -z "$KDIR" ]; then
            KDIR="$(ls -d /lib/modules/*-default/build 2>/dev/null | head -n 1)"
          fi
          echo "Building kernel modules against $KDIR"
          make modules KDIR="$KDIR"

      - name: Shell script syntax check
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n enable_polkit_howdy.sh
          bash -n disable_polkit_howdy.sh

      - name: Python recorder syntax check
        run: |
          python3 -m py_compile howdy/recorders/ir_libcamera_reader.py howdy/recorders/video_capture.py

  ubuntu-cross-check:
    name: Ubuntu 24.04 Tools & Script Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            make \
            meson \
            ninja-build \
            libcamera-dev \
            python3

      - name: Build ir-grab
        run: |
          make ir-grab
          ./tools/ir-grab/build/ir-grab --help

      - name: Shell & Python syntax check
        run: |
          bash -n install.sh uninstall.sh enable_polkit_howdy.sh disable_polkit_howdy.sh
          python3 -m py_compile howdy/recorders/ir_libcamera_reader.py howdy/recorders/video_capture.py
